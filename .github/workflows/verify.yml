# Runs the talk's keyless verification commands against a released image and
# prints their real output, so the WRONG/RIGHT identity slide is a captured log
# rather than a hand-written one.
name: verify

on:
  workflow_dispatch:
    inputs:
      tag:
        description: release tag to verify
        default: v1.0.2

env:
  IMAGE: ghcr.io/thezmc/orders-api

permissions:
  contents: read
  packages: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Resolve digest
        id: digest
        run: |
          DIGEST=$(docker buildx imagetools inspect "$IMAGE:${{ inputs.tag }}" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "resolved $IMAGE:${{ inputs.tag }} -> $DIGEST"
      - name: WRONG anyone with a valid signature passes
        run: |
          cosign verify \
            --certificate-identity-regexp '.*' \
            --certificate-oidc-issuer-regexp '.*' \
            "$IMAGE@${{ steps.digest.outputs.digest }}" | jq '.[0].optional'
      - name: RIGHT only the release workflow passes
        run: |
          cosign verify \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp \
              '^https://github\.com/theZMC/smaller-stranger-safer/\.github/workflows/release\.yml@' \
            "$IMAGE@${{ steps.digest.outputs.digest }}" | jq '.[0].optional'
      - name: Verify attestation and scan its SBOM
        run: |
          cosign verify-attestation \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp \
              '^https://github\.com/theZMC/smaller-stranger-safer/\.github/workflows/release\.yml@' \
            --type cyclonedx "$IMAGE@${{ steps.digest.outputs.digest }}" \
            | jq -r '.payload' | base64 -d | jq '.predicate' > attested-sbom.json
          jq -r '.bomFormat + " with " + (.components | length | tostring) + " components"' attested-sbom.json
