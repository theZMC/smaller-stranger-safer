name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # the workflow can prove its own identity
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: build
        with:
          file: Dockerfile.hardened
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/thezmc/orders-api:${{ github.ref_name }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        id: syft
      - name: SBOM
        run: |
          sudo install "${{ steps.syft.outputs.cmd }}" /usr/local/bin/syft
          syft ghcr.io/thezmc/orders-api@${{ steps.build.outputs.digest }} \
            -o cyclonedx-json > sbom.json
      - name: Sign and attest
        run: |
          cosign sign --yes ghcr.io/thezmc/orders-api@${{ steps.build.outputs.digest }}
          cosign attest --yes --type cyclonedx --predicate sbom.json \
            ghcr.io/thezmc/orders-api@${{ steps.build.outputs.digest }}
